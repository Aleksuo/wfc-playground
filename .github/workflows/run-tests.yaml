name: Run tests
on:
  workflow_call:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-mise
      - uses: ./.github/actions/cargo-cache
      - name: Run all tests
        run: mise run test
