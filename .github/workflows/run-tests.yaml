name: Run tests
on:
  workflow_call:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-mise
      - uses: ./.github/actions/cargo-cache
      - name: Run all tests
        run: mise run test
