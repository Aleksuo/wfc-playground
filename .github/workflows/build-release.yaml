name: Build release
on:
  workflow_call:
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-mise
      - uses: ./.github/actions/cargo-cache
      - name: Build release
        run: mise run build
