name: Build release
on:
  workflow_call:
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-mise
      - uses: ./.github/actions/cargo-cache
      - name: Build release
        run: mise run build
