name: Setup mise
description: >
  Installs mise using the vendored and version pinned install script and installs/caches tools.
runs:
  using: composite
  steps:
    - name: Restore mise tool cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.local/share/mise
          ~/.rustup
          ~/.cargo/bin
        key: mise-tools-${{ runner.os }}-${{ hashFiles('install-mise.sh', '.mise.toml') }}
        restore-keys: |
          mise-tools-${{ runner.os }}-
    - name: Install mise
      shell: bash
      run: |
        MISE_INSTALL_HELP=0 ./.mise/vendor/install.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install tools
      shell: bash
      run: |
        mise trust
        mise install
