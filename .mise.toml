min_version = "2026.7.7"

[tools]
rust = { version = "1.98.1", profile = "default", components = [
  "rustfmt",
  "clippy",
] }

"cargo:samply" = "0.13.1"

[tasks."fmt:check"]
run = "cargo fmt --check"
description = "Check Rust formatting"

[tasks."fmt:write"]
run = "cargo fmt"
description = "Format all Rust files"

[tasks."test:wfc"]
run = "cargo test -p wfc --color=always"
description = "Run tests for wfc"

[tasks."test:wfc-cli"]
run = "cargo test -p wfc-cli --color=always"
description = "Run tests for wfc-cli"

[tasks.test]
run = "cargo test --workspace --color=always"
description = "Run tests for all projects"

[tasks.build]
run = "cargo build --release --color=always"
description = "Build all projects in release mode"

[tasks."build:wfc"]
run = "cargo build --release -p wfc --color=always"
description = "Build wfc in release mode"

[tasks."build:wfc-cli"]
run = "cargo build --release -p wfc-cli --color=always"
description = "Build wfc-cli in release mode"

[tasks.lint]
run = "cargo clippy --workspace --color=always -- -D warnings"
description = "Run clippy lints for all projects"

[tasks."lint:wfc"]
run = "cargo clippy -p wfc --color=always -- -D warnings"
description = "Run clippy lints for wfc"

[tasks."lint:wfc-cli"]
run = "cargo clippy -p wfc-cli --color=always -- -D warnings"
description = "Run clippy lints for wfc-cli"

[tasks."profile:wfc-cli"]
run = "cargo build --profile profiling -p wfc-cli --color=always && samply record ./target/release/wfc-cli"
description = "Profile wfc-cli with samply"

[tasks."bench:wfc"]
run = "cargo bench --profile release -p wfc --bench '*'"
description = "Run benchmarks for wfc crate using the release profile"

[tasks."bench:wfc:baseline"]
run = "cargo bench --profile release -p wfc --bench '*' -- --save-baseline manual"
description = "Save the working tree benchmarks as the manual baseline"

[tasks."bench:wfc:compare"]
run = "cargo run --quiet --locked --manifest-path .mise/bench-wfc-compare/Cargo.toml --target-dir .output/bench-tool-target -- head"
description = "Compare the working tree benchmarks against HEAD"

[tasks."bench:wfc:compare:branch"]
run = "cargo run --quiet --locked --manifest-path .mise/bench-wfc-compare/Cargo.toml --target-dir .output/bench-tool-target -- branch"
description = "Compare the working tree benchmarks against its default-branch merge-base"

[tasks."bench:wfc:compare:manual"]
run = "cargo bench --profile release -p wfc --bench '*' -- --baseline manual"
description = "Compare the working tree benchmarks against the manual baseline"

[tasks."hooks:install"]
description = "Install the repository Git hooks"
run = "chmod +x .githooks/prepare-commit-msg && git config core.hooksPath .githooks"
run_windows = "git config core.hooksPath .githooks"
